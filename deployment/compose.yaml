services:
  radar:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      JJTRADE_API_HOST: 0.0.0.0
      JJTRADE_API_PORT: 8080
      TELEGRAM_ALERTS_ENABLED: "true"
    volumes:
      - market-data:/app/exports
    expose:
      - "8080"
    stop_grace_period: 45s
  https:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - radar
volumes:
  market-data:
  caddy-data:
  caddy-config:
